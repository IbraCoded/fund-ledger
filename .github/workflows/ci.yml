name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-not-secret
      POSTGRES_HOST: localhost
      APP_DB_USER: ledger_app
      APP_DB_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint (including security rules)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy .
      - name: Test (coverage gate in pyproject)
        run: uv run pytest --cov --cov-report=term-missing
      - name: Seed and reconcile as the least-privilege app role
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py apply_db_grants
          export POSTGRES_USER="$APP_DB_USER" POSTGRES_PASSWORD="$APP_DB_PASSWORD"
          uv run python manage.py seed_demo
          uv run python manage.py seed_demo   # must replay, not duplicate
          uv run python manage.py reconcile

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt -o requirements.txt
          uvx pip-audit --strict --disable-pip --no-deps -r requirements.txt
      - name: Build image
        run: docker build -t fund-ledger:ci .
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fund-ledger:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
