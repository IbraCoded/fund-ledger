services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db          # overrides .env: inside Compose the DB host is "db"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application -c gunicorn.conf.py"
    ports:
      - "8000:8000"

volumes:
  pgdata:
