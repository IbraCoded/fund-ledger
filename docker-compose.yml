services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      THROTTLE_USER: ${THROTTLE_USER:-600/min}
      THROTTLE_MUTATIONS: ${THROTTLE_MUTATIONS:-60/min}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "rm -rf /tmp/prometheus && mkdir -p /tmp/prometheus &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application -c gunicorn.conf.py"
    ports:
      - "8000:8000"
  locust:
    image: locustio/locust
    profiles: ["load"]
    volumes:
      - ./loadtest:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://api:8000
    ports:
      - "8089:8089"
    depends_on:
      - api

volumes:
  pgdata:
